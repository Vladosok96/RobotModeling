name: ur5e-student-lab
services:
  lab:
    build:
      context: .
      args:
        BUILD_JOBS: ${BUILD_JOBS:-2}
    image: ur5e-student-lab:humble-r2023b
    platform: linux/amd64
    ports:
      - "127.0.0.1:${LAB_PORT:-8080}:8080"
    shm_size: 512mb
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/vnc.html"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
